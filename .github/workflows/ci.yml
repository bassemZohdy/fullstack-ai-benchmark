name: Offline regression checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: Check evaluator syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find EVAL E2E_TESTS -type f -name '*.js' -print0)
      - name: Run offline regression fixtures
        run: bash scripts/test-regressions.sh
